<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VIP Cyber Shield | Security Check</title>
  <!-- Telegram WebApp Native SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #030712;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #a855f7;
      --cyber-red: #ef4444;
      --cyber-green: #10b981;
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 0% 50%, rgba(239, 68, 68, 0.12) 0%, transparent 45%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      color: #ffffff;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
      pointer-events: none;
    }

    .top-header {
      width: 100%;
      max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .user-details h4 {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.3px;
    }

    .user-details p {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      margin-top: 2px;
    }

    .status-badge {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #818cf8;
    }

    .status-badge.active {
      color: var(--cyber-green);
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 36px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      margin: auto 0;
    }

    .icon-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(99, 102, 241, 0.4);
      animation: spin 12s linear infinite;
    }

    .pulse-ring-inner {
      position: absolute;
      width: 115%;
      height: 115%;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--accent);
      border-bottom-color: var(--primary);
      animation: spin 3s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .shield-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px var(--primary-glow);
    }

    .shield-icon svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }

    h2 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 13.5px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .verify-box {
      background: rgba(3, 7, 18, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .verify-box:hover {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.05);
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .checkbox {
      width: 26px;
      height: 26px;
      border: 2px solid #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.5);
    }

    .verify-box.verified .checkbox {
      background: var(--cyber-green);
      border-color: var(--cyber-green);
    }

    .checkbox svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: white;
      stroke-width: 3;
      display: none;
    }

    .verify-box.verified .checkbox svg {
      display: block;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-continue {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      border: none;
      border-radius: 20px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      display: none;
      margin-top: 20px;
    }

    .footer-area {
      text-align: center;
      margin-top: 15px;
    }

    .vip-credit {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 20px;
      border-radius: 50px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .vip-credit span {
      color: #ef4444;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="user-info">
      <div class="avatar" id="avatarText">U</div>
      <div class="user-details">
        <h4 id="userName">TELEGRAM USER</h4>
        <p id="userId">ID: --------</p>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span id="badgeText">SECURE</span>
    </div>
  </div>

  <div class="card">
    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <div class="pulse-ring-inner"></div>
      <div class="shield-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 2.18l7 3.89v5.93c0 4.56-3.13 8.84-7 9.88-3.87-1.04-7-5.32-7-9.88V8.07l7-3.89z"/>
        </svg>
      </div>
    </div>

    <h2>Cyber Verification</h2>
    <p class="subtitle">Complete verification to access the bot.</p>

    <div class="verify-box" id="verifyBox" onclick="startVerification()">
      <div class="checkbox-container">
        <div class="checkbox" id="checkbox">
          <svg id="checkIcon" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="verify-text" id="statusText">I am human</span>
      </div>
      <div class="spinner" id="spinner"></div>
    </div>

    <button class="btn-continue" id="btnContinue" onclick="redirectToBot()">CONTINUE TO BOT</button>
  </div>

  <div class="footer-area">
    <div class="vip-credit">
      DEVELOPED BY <span>@Daddy_Huu</span>
    </div>
  </div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    } catch(e) {}
  }

  // Generate Exact Device Fingerprint Expected by Bot Python Code
  function getDeviceFingerprint() {
    const components = [
      navigator.userAgent,
      screen.width + 'x' + screen.height + 'x' + screen.colorDepth,
      navigator.hardwareConcurrency || '4',
      Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Kolkata',
      navigator.language || 'en'
    ];
    const str = components.join('###');
    let h1 = 0xdeadbeef ^ 0, h2 = 0x41c6ce57 ^ 0;
    for (let i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  }

  // Send Webhook directly matching Python Bot Options
  async function sendBotWebhookPayload() {
    const params = new URLSearchParams(window.location.search);
    const rawWebhook = params.get('webhook');

    if (!rawWebhook) return;

    const cleanUrl = decodeURIComponent(rawWebhook);
    const fp = getDeviceFingerprint();

    // Payload EXACTLY matching Python code variables: status, message, fp, deviceCheckEnabled
    const payload = {
      status: "pass",
      message: "Verified Successfully",
      fp: fp,
      deviceCheckEnabled: true
    };

    const jsonString = JSON.stringify(payload);

    try {
      await fetch(cleanUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: jsonString,
        keepalive: true
      });
    } catch(e) {}
  }

  function finishAndClose() {
    setTimeout(() => {
      if (window.Telegram && window.Telegram.WebApp) {
        try { window.Telegram.WebApp.close(); } catch(e) {}
      }
    }, 500);
  }

  window.addEventListener('load', () => {
    let extractedName = "TELEGRAM USER";
    let extractedId = "6259793146";

    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
      const u = window.Telegram.WebApp.initDataUnsafe.user;
      extractedName = (u.first_name + " " + (u.last_name || "")).trim();
      extractedId = u.id;
    }

    document.getElementById('userName').innerText = extractedName.toUpperCase();
    document.getElementById('userId').innerText = "ID: " + extractedId;
    document.getElementById('avatarText').innerText = extractedName.charAt(0).toUpperCase();
  });

  async function startVerification() {
    const box = document.getElementById('verifyBox');
    const text = document.getElementById('statusText');
    const spinner = document.getElementById('spinner');
    const btnContinue = document.getElementById('btnContinue');

    text.innerText = "Verifying...";
    spinner.style.display = "block";

    setTimeout(async () => {
      spinner.style.display = "none";
      box.classList.add('verified');
      text.innerText = "Verified Successfully!";
      text.style.color = "#10b981";
      btnContinue.style.display = "block";

      await sendBotWebhookPayload();
      finishAndClose();
    }, 1200);
  }

  function redirectToBot() {
    finishAndClose();
  }
</script>
</body>
</html>
