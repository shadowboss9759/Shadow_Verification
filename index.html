<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Security Shield</title>
  <!-- Telegram WebApp Native SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: #050914;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.2) 0%, transparent 70%),
        radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 0% 50%, rgba(220, 38, 38, 0.15) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 15px;
      color: #ffffff;
    }

    /* Top User Header Bar */
    .top-header {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .user-details h4 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }

    .user-details p {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      margin-top: 2px;
    }

    .status-badge {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #818cf8;
    }

    .status-badge.active {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.3);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Central Card */
    .card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 0 0 40px rgba(220, 38, 38, 0.2);
      position: relative;
      overflow: hidden;
      margin: auto 0;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(transparent, rgba(220, 38, 38, 0.35), transparent 30%);
      animation: rotate 5s linear infinite;
      z-index: -1;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    /* Orbit Shield Icon */
    .icon-container {
      position: relative;
      width: 95px;
      height: 95px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid transparent;
      border-top-color: #dc2626;
      border-right-color: #9333ea;
      border-radius: 50%;
      animation: spin 1.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .shield-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #dc2626, #9333ea);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(220, 38, 38, 0.5);
      transition: all 0.4s ease;
    }

    .shield-icon svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }

    h2 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Checkbox Box */
    .verify-box {
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .verify-box:hover {
      border-color: rgba(220, 38, 38, 0.6);
      background: rgba(3, 7, 18, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .checkbox {
      width: 26px;
      height: 26px;
      border: 2px solid #475569;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .verify-box.verified .checkbox {
      background: #10b981;
      border-color: #10b981;
    }

    .verify-box.failed .checkbox {
      background: #ef4444;
      border-color: #ef4444;
    }

    .checkbox svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s ease;
    }

    .verify-box.verified .checkbox svg,
    .verify-box.failed .checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .verify-text {
      color: #f8fafc;
      font-weight: 600;
      font-size: 15px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: #dc2626;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-top: 18px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #dc2626, #9333ea);
      border-radius: 10px;
      transition: width 0.1s linear;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.8);
    }

    .status-msg {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }

    .status-msg.success { color: #34d399; }
    .status-msg.danger { color: #f87171; }

    /* CONTINUE TO BOT Button */
    .btn-continue {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 18px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.5), 0 0 15px rgba(59, 130, 246, 0.4);
      transition: all 0.3s ease;
      display: none;
      margin-top: 18px;
    }

    .btn-continue:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 35px rgba(37, 99, 235, 0.7), 0 0 25px rgba(59, 130, 246, 0.6);
      background: linear-gradient(135deg, #60a5fa, #1d4ed8);
    }

    /* Footer Branding */
    .footer-area {
      text-align: center;
      margin-top: 15px;
    }

    .vip-credit {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 22px;
      border-radius: 50px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 0, 0, 0.8);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .vip-credit span {
      color: #dc2626;
      text-shadow: 0 0 10px rgba(220, 38, 38, 0.9);
    }

    .copyright {
      font-size: 11.5px;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Top Profile Header -->
  <div class="top-header">
    <div class="user-info">
      <div class="avatar" id="avatarText">U</div>
      <div class="user-details">
        <h4 id="userName">TELEGRAM USER</h4>
        <p id="userId">ID: --------</p>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span id="badgeText">SCANNING</span>
    </div>
  </div>

  <!-- Central Card -->
  <div class="card" id="mainCard">
    <div class="icon-container">
      <div class="orbit-ring" id="orbitRing"></div>
      <div class="shield-icon" id="shieldIcon">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/>
        </svg>
      </div>
    </div>

    <h2 id="cardTitle">VIP Security System</h2>
    <p id="cardSubtitle">Please complete human verification to proceed.</p>

    <!-- Verification Box -->
    <div class="verify-box" id="verifyBox" onclick="startVerification()">
      <div class="checkbox-container">
        <div class="checkbox" id="checkbox">
          <svg id="checkIcon" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <svg id="crossIcon" viewBox="0 0 24 24" style="display:none;">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
        <span class="verify-text" id="statusText">I am human</span>
      </div>
      <div class="spinner" id="spinner"></div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <!-- Continue to Bot Button -->
    <button class="btn-continue" id="btnContinue" onclick="closeOrRedirect()">CONTINUE TO BOT</button>
  </div>

  <!-- Footer Branding -->
  <div class="footer-area">
    <div class="vip-credit">
      MADE BY <span>@Daddy_Huu</span>
    </div>
    <div class="copyright">
      © 2026 Shadow | Designed By Shadow
    </div>
  </div>

<script>
  // Telegram WebApp SDK Setup
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    } catch(e) { console.error("WebApp Init Error:", e); }
  }

  // Universal Bot ID Detector
  function getUniversalBotId() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('botusername')) return "bot_" + params.get('botusername');
    if (params.get('bot')) return "bot_" + params.get('bot');
    if (params.get('bot_id')) return "bot_" + params.get('bot_id');
    if (params.get('webhook')) return "wh_" + btoa(params.get('webhook')).replace(/[^a-zA-Z0-9]/g, '').substring(0, 15);
    return "global_default_bot";
  }

  const currentBotId = getUniversalBotId();
  const DEVICE_LOCK_KEY = "daddy_huu_verified_" + currentBotId;
  let isVerifying = false;

  // 🎯 FIXED & IMPROVED WEBHOOK EXECUTION
  async function triggerWebhookAndFinish() {
    const params = new URLSearchParams(window.location.search);
    const rawWebhook = params.get('webhook');
    const botName = params.get('botusername') || params.get('bot') || params.get('bot_id');
    
    // Get user info to append to webhook
    let userId = "";
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
      userId = window.Telegram.WebApp.initDataUnsafe.user.id;
    } else {
      userId = params.get('user_id') || params.get('uid') || params.get('id') || "";
    }

    // Final Close & Redirect Function
    function finalize() {
      if (window.Telegram && window.Telegram.WebApp) {
        // Try to send data (only works for keyboard buttons)
        try { window.Telegram.WebApp.sendData("verified"); } catch(e) {}
        // Close the webapp
        try { window.Telegram.WebApp.close(); } catch(e) {}
      }
      
      // Fallback Redirect (for browser or if WebApp.close didn't trigger)
      setTimeout(() => {
        if (botName && !botName.startsWith('http')) {
          const cleanName = botName.replace('@', '').trim();
          window.location.href = "https://t.me/" + cleanName;
        } else {
          window.location.href = "https://t.me";
        }
      }, 500);
    }

    if (rawWebhook) {
      let cleanUrl = decodeURIComponent(rawWebhook);
      
      // Auto-append user_id and status to ensure bot receives the update
      if (userId && !cleanUrl.includes('user_id=') && !cleanUrl.includes('uid=')) {
        cleanUrl += (cleanUrl.includes('?') ? '&' : '?') + 'user_id=' + userId + '&status=verified';
      } else if (!cleanUrl.includes('status=')) {
        cleanUrl += (cleanUrl.includes('?') ? '&' : '?') + 'status=verified';
      }
      
      // Add cache buster
      cleanUrl += (cleanUrl.includes('?') ? '&' : '?') + '_cb=' + Date.now();

      try {
        // Use fetch with keepalive to ensure it hits the server even if we close the window
        await fetch(cleanUrl, { mode: 'no-cors', keepalive: true });
        setTimeout(finalize, 800); // Give server time to process
      } catch (e) {
        // Fallback to Image ping if fetch fails
        const pingImg = new Image();
        pingImg.onload = finalize;
        pingImg.onerror = finalize;
        pingImg.src = cleanUrl;
        setTimeout(finalize, 3000); // Backup timeout
      }
    } else {
      finalize();
    }
  }

  // FIXED: Added missing function that was called by the button
  function closeOrRedirect() {
    triggerWebhookAndFinish();
  }

  // For compatibility
  function redirectToBot() {
    triggerWebhookAndFinish();
  }

  // Extract User Info & Check Verified State
  window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);

    let extractedName = "";
    let extractedId = "";

    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
      const u = window.Telegram.WebApp.initDataUnsafe.user;
      extractedName = (u.first_name + " " + (u.last_name || "")).trim();
      extractedId = u.id;
    }

    if (!extractedName) {
      extractedName = params.get('user_name') || params.get('name') || params.get('first_name') || "TELEGRAM USER";
    }
    if (!extractedId) {
      extractedId = params.get('user_id') || params.get('uid') || params.get('id') || "6259793146";
    }

    document.getElementById('userName').innerText = extractedName.toUpperCase();
    document.getElementById('userId').innerText = "ID: " + extractedId;
    document.getElementById('avatarText').innerText = extractedName.charAt(0).toUpperCase();

    // Already Verified Lock Check
    const isAlreadyVerified = localStorage.getItem(DEVICE_LOCK_KEY);
    if (isAlreadyVerified) {
      document.getElementById('cardTitle').innerText = "Already Verified";
      document.getElementById('cardTitle').style.color = "#818cf8";
      document.getElementById('cardSubtitle').innerText = "This device has already been authorized for use.";
      document.getElementById('verifyBox').style.display = 'none';
      document.getElementById('btnContinue').style.display = 'block';
      document.getElementById('statusBadge').classList.add('active');
      document.getElementById('badgeText').innerText = "ACTIVE";
      document.getElementById('orbitRing').style.display = 'none';
    }
  });

  // Start Verification
  function startVerification() {
    if (isVerifying) return;
    isVerifying = true;

    const box = document.getElementById('verifyBox');
    const text = document.getElementById('statusText');
    const spinner = document.getElementById('spinner');
    const statusMsg = document.getElementById('statusMsg');
    const checkIcon = document.getElementById('checkIcon');
    const crossIcon = document.getElementById('crossIcon');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const btnContinue = document.getElementById('btnContinue');
    const badge = document.getElementById('statusBadge');
    const badgeText = document.getElementById('badgeText');

    text.innerText = "Analyzing Security...";
    spinner.style.display = "block";
    progressContainer.style.display = "block";

    let progress = 0;
    const progressInterval = setInterval(() => {
      progress += 10;
      progressBar.style.width = progress + "%";
      if (progress >= 100) {
        clearInterval(progressInterval);
      }
    }, 120);

    setTimeout(() => {
      spinner.style.display = "none";
      const isAlreadyVerified = localStorage.getItem(DEVICE_LOCK_KEY);

      if (isAlreadyVerified) {
        box.classList.add('failed');
        checkIcon.style.display = "none";
        crossIcon.style.display = "block";
        text.innerText = "Verification Failed!";
        text.style.color = "#ef4444";

        statusMsg.className = "status-msg danger";
        statusMsg.innerText = "❌ Security Alert: Device already verified for this bot!";
        statusMsg.style.display = "block";

        btnContinue.style.display = "block";
      } else {
        localStorage.setItem(DEVICE_LOCK_KEY, "VERIFIED_" + Date.now());

        box.classList.add('verified');
        text.innerText = "Verified Successfully!";
        text.style.color = "#10b981";

        statusMsg.className = "status-msg success";
        statusMsg.innerText = "✔ Success! Unlocking Bot...";
        statusMsg.style.display = "block";

        badge.classList.add('active');
        badgeText.innerText = "ACTIVE";
        btnContinue.style.display = "block";

        // 🔥 Wait for Server to complete Webhook execution BEFORE closing
        triggerWebhookAndFinish();
      }
    }, 1500);
  }
</script>
</body>
</html>
